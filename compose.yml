name: media-stack

services:
  jellyfin:
    image: ${JELLYFIN_IMAGE}
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    group_add:
      - "${RENDER_GID}"
    environment:
      TZ: ${TZ}
    volumes:
      - type: bind
        source: /srv/media-stack/config/jellyfin
        target: /config
      - type: bind
        source: /srv/media-stack/config/jellyfin/cache
        target: /cache
      - type: bind
        source: /srv/media-stack/data/media
        target: /media
        read_only: true
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "${JELLYFIN_LAN_IP}:8096:8096/tcp"
      # Private Tailscale Serve backend. This is host-loopback only, so it is
      # unreachable from the LAN or Internet except through Tailscale.
      - "127.0.0.1:8096:8096/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qbittorrent:
    image: ${QBITTORRENT_IMAGE}
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"
      # 8080 belongs to the existing Nextcloud deployment on this host.
      WEBUI_PORT: "8181"
      TORRENTING_PORT: "6881"
    volumes:
      - type: bind
        source: /srv/media-stack/config/qbittorrent
        target: /config
      - type: bind
        source: /srv/media-stack/data
        target: /data
    ports:
      - "${JELLYFIN_LAN_IP}:8181:8181/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:8181:8181/tcp"
      - "${JELLYFIN_LAN_IP}:6881:6881/tcp"
      - "${JELLYFIN_LAN_IP}:6881:6881/udp"
    networks:
      - media
    # This workload performs the bulk of the shared HDD I/O. Give Arr's
    # database and API work priority when the kernel is scheduling disk I/O.
    blkio_config:
      weight: 100
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: unless-stopped

  prowlarr:
    image: ${PROWLARR_IMAGE}
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"
    volumes:
      - type: bind
        source: /srv/media-stack/config/prowlarr
        target: /config
    ports:
      - "${JELLYFIN_LAN_IP}:9696:9696/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:9696:9696/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  sonarr:
    image: ${SONARR_IMAGE}
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"
    volumes:
      - type: bind
        source: /srv/media-stack/config/sonarr
        target: /config
      - type: bind
        source: /srv/media-stack/data
        target: /data
    ports:
      - "${JELLYFIN_LAN_IP}:8989:8989/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:8989:8989/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  radarr:
    image: ${RADARR_IMAGE}
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"
    volumes:
      - type: bind
        source: /srv/media-stack/config/radarr
        target: /config
      - type: bind
        source: /srv/media-stack/data
        target: /data
    ports:
      - "${JELLYFIN_LAN_IP}:7878:7878/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:7878:7878/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  seerr:
    image: ${SEERR_IMAGE}
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ}
      PORT: "5055"
    volumes:
      # Retain the planned Jellyseerr configuration path for straightforward
      # backups and to make any future migration transparent.
      - type: bind
        source: /srv/media-stack/config/jellyseerr
        target: /app/config
    ports:
      - "${JELLYFIN_LAN_IP}:5055:5055/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:5055:5055/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  media-dashboard:
    # Reuse the already-pulled Seerr image solely for its maintained Node 22
    # runtime. The dashboard itself uses no third-party Node packages.
    image: ${SEERR_IMAGE}
    container_name: media-dashboard
    entrypoint: ["node", "/app/dashboard/server.js"]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      PORT: "3000"
    volumes:
      # Dashboard code is immutable from inside the container.
      - type: bind
        source: /home/fabjon/media-stack-config-git/apps/media-dashboard
        target: /app/dashboard
        read_only: true
      # Read existing credentials only at runtime; no duplicate secret file is
      # created and the HTTP API never returns these values.
      - type: bind
        source: /srv/media-stack/config/radarr/config.xml
        target: /run/radarr-config.xml
        read_only: true
      - type: bind
        source: /srv/media-stack/config/sonarr/config.xml
        target: /run/sonarr-config.xml
        read_only: true
      - type: bind
        source: /srv/media-stack/config/jellyseerr/settings.json
        target: /run/seerr-settings.json
        read_only: true
      # A dashboard-specific passphrase gates the only write actions. It is
      # never returned to the browser, included in reports, or reused from an
      # Arr/Seerr credential.
      - type: bind
        source: /srv/media-stack/config/media-dashboard/action-token
        target: /run/dashboard-action-token
        read_only: true
      # Correlate only matching request-hand-off evidence. The dashboard
      # sanitizes every displayed log message and has no write access.
      - type: bind
        source: /srv/media-stack/config/jellyseerr/logs
        target: /run/seerr-logs
        read_only: true
      - type: bind
        source: /srv/media-stack/config/radarr/logs
        target: /run/radarr-logs
        read_only: true
      # Expose only the kernel's aggregate pressure-stall counters, not the
      # host process table, filesystem, or Docker socket.
      - type: bind
        source: /proc/pressure
        target: /run/host-pressure
        read_only: true
      # Subtitle presence is derived from the actual media directories.
      - type: bind
        source: /srv/media-stack/data/media
        target: /data/media
        read_only: true
      # Only qBittorrent's rolling activity log is read, and only matching
      # per-title events are included in a response.
      - type: bind
        source: /srv/media-stack/config/qbittorrent/qBittorrent/logs
        target: /run/qbittorrent
        read_only: true
    ports:
      # Tailnet-only: Tailscale Serve is the sole published access path.
      - "127.0.0.1:3000:3000/tcp"
    networks:
      - media
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  bazarr:
    image: ${BAZARR_IMAGE}
    container_name: bazarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      UMASK: "002"
    volumes:
      - type: bind
        source: /srv/media-stack/config/bazarr
        target: /config
      # This must exactly match Sonarr and Radarr's media path. Consistent
      # paths avoid Bazarr path-mapping errors.
      - type: bind
        source: /srv/media-stack/data
        target: /data
    ports:
      - "${JELLYFIN_LAN_IP}:6767:6767/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:6767:6767/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  libretranslate:
    # Local, offline English-to-Italian/Albanian translation engine. It has no
    # host port, so only Lingarr on the private media network can reach it.
    image: ${LIBRETRANSLATE_IMAGE:-libretranslate/libretranslate:v1.9.6@sha256:98d9ec356102a93ffb4e88046688a1a7ab2f3bf8e54b63588332c04f9686a668}
    container_name: libretranslate
    # This is an on-demand dependency managed by
    # lingarr-libretranslate-watchdog.service. Keep its CPU use bounded when
    # actual translations are in progress, and do not auto-start it at boot.
    cpus: "1.0"
    # The upstream image's Argos-model directory is a Docker named volume.
    # Run as container-root so a fresh root-owned volume can be initialized;
    # this service has no host bind mounts or published port.
    user: "0:0"
    environment:
      # The persistent model volume already existed with English/Albanian.
      # Update its model set on startup so Italian is installed as well.
      LT_UPDATE_MODELS: "true"
      LT_LOAD_ONLY: "en,it,sq"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - type: volume
        source: libretranslate-models
        target: /home/libretranslate/.local/share/argos-translate
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: "no"

  lingarr:
    # Automates the fallback: keep native Italian/Albanian subtitles when
    # present; otherwise translate a matching English subtitle locally.
    image: ${LINGARR_IMAGE:-lingarr/lingarr:1.3.0@sha256:c250b0e43cf06690676dd9b1a12a37eaec86eea93488673cc74cc18dbd6680b3}
    container_name: lingarr
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      ASPNETCORE_URLS: "http://+:9876"
      DB_CONNECTION: sqlite
      SQLITE_DB_PATH: /app/config/local.db
      DB_HANGFIRE_SQLITE_PATH: /app/config/Hangfire.db
      MAX_CONCURRENT_JOBS: "1"
      SERVICE_TYPE: '["libretranslate"]'
      LIBRE_TRANSLATE_URL: http://libretranslate:5000
      SOURCE_LANGUAGES: '[{"name":"English","code":"en"}]'
      TARGET_LANGUAGES: '[{"name":"Italian","code":"it"},{"name":"Albanian","code":"sq"}]'
      # Tailscale Serve publishes the host-loopback backend privately to the
      # tailnet. Authentication remains disabled, so tailnet membership is
      # the access boundary for remote access.
      AUTH_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    volumes:
      - type: bind
        source: /srv/media-stack/config/lingarr
        target: /app/config
      # Preserve the exact /data/media paths reported by Sonarr and Radarr.
      - type: bind
        source: /srv/media-stack/data/media
        target: /data/media
    ports:
      - "${JELLYFIN_LAN_IP}:9876:9876/tcp"
      # Lets the host-only setup task reach Lingarr without exposing it beyond
      # the existing LAN binding above.
      - "127.0.0.1:9876:9876/tcp"
    networks:
      - media
    # LibreTranslate is deliberately not a Compose startup dependency: the
    # host watchdog starts it only for a real Lingarr TranslationJob, waits for
    # its health check, then releases Lingarr's queued work.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  lingarr-requests:
    # Tailnet-only companion PWA for selecting one Jellyfin movie/episode and
    # submitting a native file-backed Lingarr translation request.
    image: media-stack/lingarr-requests:local
    build:
      context: /home/fabjon/media-stack-config-git/apps/lingarr-requests
    container_name: lingarr-requests
    user: "1000:1000"
    environment:
      PORT: "8080"
      JELLYFIN_URL: http://jellyfin:8096
      LINGARR_URL: http://lingarr:9876
      MEDIA_ROOT: /media
      LINGARR_MEDIA_ROOT: /data/media
      STATE_DB: /state/requests.sqlite3
    volumes:
      - type: bind
        source: /srv/media-stack/data/media
        target: /media
        read_only: true
      - type: bind
        source: /srv/media-stack/config/lingarr-requests
        target: /state
    ports:
      - "127.0.0.1:3011:8080/tcp"
    networks:
      - media
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  recyclarr:
    image: ${RECYCLARR_IMAGE}
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - type: bind
        source: /srv/media-stack/config/recyclarr
        target: /config
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: "no"

  maintainerr:
    image: ${MAINTAINERR_IMAGE}
    container_name: maintainerr
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # Keep anonymous usage reporting disabled for this private LAN service.
      TELEMETRY: "off"
    volumes:
      - type: bind
        source: /srv/media-stack/config/maintainerr
        target: /opt/data
    ports:
      # Maintainerr has no built-in login. Its loopback backend is published
      # privately through Tailscale Serve; tailnet membership is the remote
      # access boundary.
      - "${JELLYFIN_LAN_IP}:6246:6246/tcp"
      # Private Tailscale Serve backend; keep the normal LAN binding above.
      - "127.0.0.1:6246:6246/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  scrutiny:
    image: ${SCRUTINY_IMAGE}
    container_name: scrutiny
    environment:
      TZ: ${TZ}
      # One low-impact SMART scan each day; an initial scan is run after start.
      COLLECTOR_CRON_SCHEDULE: "15 3 * * *"
    volumes:
      - type: bind
        source: /srv/media-stack/config/scrutiny
        target: /opt/scrutiny/config
      - type: bind
        source: /srv/media-stack/config/scrutiny/influxdb
        target: /opt/scrutiny/influxdb
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
    # Restrict SMART access to the one detected physical disk, rather than
    # passing the complete /dev tree through to the container.
    devices:
      - /dev/sda:/dev/sda
    cap_add:
      - SYS_RAWIO
    ports:
      - "${JELLYFIN_LAN_IP}:8081:8080/tcp"
    networks:
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cloudflared-media:
    image: ${CLOUDFLARED_MEDIA_IMAGE}
    container_name: cloudflared-media
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_MEDIA_TOKEN}
    networks:
      # Separate from the existing Nextcloud connector so every configured
      # origin is reachable by every connector serving this tunnel.
      - media
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  media:
    name: media
    driver: bridge

volumes:
  libretranslate-models:
    name: libretranslate-models
